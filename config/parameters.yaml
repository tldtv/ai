# =====================================================================
# Управленческие параметры процесса сорсинга и приоритизации идей
# для Авито.Работы. Меняйте значения здесь — код их просто читает.
# Каждое изменение — обычный git commit, история правок видна через
# `git log -- config/parameters.yaml` (это и есть журнал изменений
# параметров процесса, отдельный файл под него не нужен).
# =====================================================================

# Целевое окно для ретроспективного сбора (backfill).
# Live-режим им не ограничен — он берёт всё новое на момент запуска.
target_window:
  start: "2026-06-01"
  end: "2026-08-31"

# Как часто должен запускаться live-режим (см. .github/workflows) — это
# описательное поле, реальное расписание задаётся в workflow-файле.
update_cadence_days: 7

# Пороги светофора для дашборда, по полю priority_score (шкала 1-5)
traffic_light_thresholds:
  green_min: 4.0
  yellow_min: 2.5
  # ниже yellow_min -> красный

# Веса критериев приоритизации. Меняя веса, вы не трогаете код —
# модель получает актуальный список критериев при каждом запуске.
priority_weights:
  strategic_fit: 1.0        # соответствие одному из трёх рынков
  signal_strength: 1.0      # число независимых источников/повторений
  market_growth: 1.0        # размер и динамика возможности
  asset_fit: 1.0            # fit с активами Авито (трафик, база, данные)
  feasibility: 1.0          # реализуемость MVP
  urgency: 1.0              # окно/конкурентное давление
  regulatory_risk: 1.0      # регуляторный и репутационный риск

# Ограничения процесса — используются только дашбордом/README для
# отображения контекста, на сам сбор сигналов не влияют.
process_constraints:
  max_parallel_discovery: 1
  discovery_timebox_weeks: 4

# Ключевые слова для черновой (эвристической) разметки рынка.
# Финальную гипотезу и рынок уточняет модель на этапе анализа.
markets:
  Классифайд:
    keywords: ["job board", "classifieds", "vacancy marketplace", "listing"]
  Подработка:
    keywords: ["gig", "earned wage", "instant pay", "staffing platform", "marketplace", "hourly", "shift", "gig worker"]
  HR-tech:
    keywords: ["recruit", "ats", "screening", "interview", "hiring workflow", "hr tech", "talent", "ai recruiter"]

# Модель для смыслового анализа (src/analyze_signals.py).
llm:
  model: "claude-sonnet-4-5"
  # ПРОВЕРЬТЕ актуальное имя модели в console.anthropic.com -> Models
  # и поправьте значение здесь, если оно изменилось.

# Источники. type: rss — проверенный рабочий RSS (оба ниже реально
# протестированы и отдают валидный фид на момент подготовки). Остальные
# тиры из плана добавляйте сюда же по мере того, как найдёте у них
# рабочий RSS-адрес — см. README, раздел "Источники без RSS" про
# Telegram-каналы и сайты без фида.
sources:
  - name: "HR Tech Feed"
    tier: 1
    type: rss
    url: "https://hrtechfeed.com/feed/"
  - name: "TechCrunch"
    tier: 2
    type: rss
    url: "https://techcrunch.com/feed/"
   - name: "Crunchbase News"
    tier: 1
    type: rss
    url: "https://news.crunchbase.com/feed/"
  - name: "Recruiting Brainfood"
    tier: 1
    type: rss
    url: "https://www.recruitingbrainfood.com/feed"
  - name: "Sifted"
    tier: 2
    type: rss
    url: "https://sifted.eu/feed"
  - name: "Rest of World"
    tier: 2
    type: rss
    url: "https://restofworld.org/feed/"
  - name: "Y Combinator Blog"
    tier: 2
    type: rss
    url: "https://www.ycombinator.com/blog/rss"
