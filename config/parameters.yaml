# =====================================================================
# Управленческие параметры процесса сорсинга и приоритизации идей для Авито.Работы. При изменении значений здесь — код их просто прочитает.
# Каждое изменение — обычный git commit, история правок видна через `git log -- config/parameters.yaml` (это и есть журнал изменений параметров процесса, отдельный файл под него не нужен).
# =====================================================================

# Целевое окно для ретроспективного сбора (backfill).
# Live-режим им не ограничен — он берёт всё новое на момент запуска.
target_window:
  start: "2026-06-01"
  end: "2026-08-31"

# Как часто должен запускаться live-режим (см. .github/workflows) — это описательное поле, реальное расписание задаётся в workflow-файле.
update_cadence_days: 7

# Пороги светофора для дашборда, по полю priority_score (шкала 1-5)
traffic_light_thresholds:
  green_min: 3.8
  yellow_min: 2.3
  # ниже yellow_min -> красный

dashboard:
  title: "Точки роста — Авито.Работа"
  accent_color: "#7C3AED"
  github_repo: "tldtv/ai"
  firebase:
    api_key: "AIzaSyA2e9RTnznpcBJ7ofwzYNE9OlNyphWXyvE"
    auth_domain: "avito-signal-agent.firebaseapp.com"
    project_id: "avito-signal-agent"
    storage_bucket: "avito-signal-agent.firebasestorage.app"
    messaging_sender_id: "622646642971"
    app_id: "1:622646642971:web:d2fba93b2c4d3611182bbe"
  # Ориентир на фирменный фиолетовый Авито

# Веса критериев приоритизации. Меняя веса мы не трогаем код — модель получает актуальный список критериев при каждом запуске.
priority_weights:
  strategic_fit: 1.0        # соответствие одному из трёх рынков
  signal_strength: 1.0      # число независимых источников/повторений
  market_growth: 1.0        # размер и динамика возможности
  asset_fit: 1.0            # fit с активами Авито (трафик, база, данные)
  feasibility: 1.0          # реализуемость MVP
  urgency: 1.0              # окно/конкурентное давление
  regulatory_risk: 1.0      # регуляторный и репутационный риск

# Ограничения процесса — используются только дашбордом/README для отображения контекста, на сам сбор сигналов не влияют.
process_constraints:
  max_parallel_discovery: 1
  discovery_timebox_weeks: 4

# Ключевые слова для черновой (эвристической) разметки рынка.
# Финальную гипотезу и рынок уточняет модель на этапе анализа.
markets:
  Классифайд:
    keywords: ["job board", "classifieds", "vacancy marketplace", "listing"]
    description: "Классифайд/джоборды — размещение вакансий как объявлений, без транзакционной модели внутри платформы."
  Подработка:
    keywords: ["gig", "earned wage", "instant pay", "staffing platform", "marketplace", "hourly", "shift", "gig worker"]
    description: "Авито.Подработка — транзакционная платформенная занятость: смены и гиг-задачи, сделка происходит внутри платформы."
  HR-tech:
    keywords: ["recruit", "ats", "screening", "interview", "hiring workflow", "hr tech", "talent", "ai recruiter"]
    description: "HR-tech — продукты HRmost и AIR: инструменты автоматизации найма и рекрутинга для бизнеса."

# Модель для смыслового анализа (src/analyze_signals.py).
llm:
  model: "claude-sonnet-4-5"
  # !!!ПРОВЕРИТЬ актуальное имя модели в console.anthropic.com -> Models и поправьте значение здесь, если оно изменилось.

source_groups:
  "РФ/ТГ":
    description: "Русскоязычные СМИ и Telegram-каналы про HR-tech, рекрутинг, стартапы и рынок труда в России."
  "Мировой":
    description: "Англоязычные международные источники про HR-tech, стартапы, венчур и рынок труда."

