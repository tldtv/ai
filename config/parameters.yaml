# =====================================================================
# Управленческие параметры процесса сорсинга и приоритизации идей
# для Авито.Работы. Меняйте значения здесь — код их просто читает.
# Каждое изменение — обычный git commit, история правок видна через
# `git log -- config/parameters.yaml` (это и есть журнал изменений
# параметров процесса, отдельный файл под него не нужен).
# =====================================================================

# Целевое окно для ретроспективного сбора (backfill) — используется
# ТОЛЬКО отдельным workflow .github/workflows/historical_backfill.yml
# (запускается вручную, по расписанию не работает). Обычный еженедельный
# workflow (weekly_signal_scan.yml) этим окном не ограничен и не
# использует его вообще — см. weekly_recency_days ниже.
target_window:
  start: "2026-06-01"
  end: "2026-08-31"

# Как часто должен запускаться live-режим (см. .github/workflows) — это
# описательное поле, реальное расписание задаётся в workflow-файле.
update_cadence_days: 7

# Стоимостная защита обычного (не-backfill) запуска: статья попадает в
# платный анализ (analyze_signals.py), только если её дата публикации не
# старше этого числа дней от сегодня — даже если по ссылке она ещё не
# встречалась в бэклоге. Раньше такого ограничения не было вообще: в
# режиме "weekly" в анализ уходило ВСЁ, что RSS-лента отдаёт прямо сейчас
# (обычно последние 20-50 записей на каждый источник) — на первом запуске
# или после нескольких подряд нажатий «Run workflow» вручную это могло
# вылиться в неожиданно большой счёт за один день. Стоит чуть больше
# update_cadence_days (7) — небольшой запас на случай, если сигнал
# опубликован ровно на границе недели.
weekly_recency_days: 10

# Пороги светофора для дашборда, по полю priority_score (шкала 1-5)
traffic_light_thresholds:
  green_min: 4.0
  yellow_min: 2.5
  # ниже yellow_min -> красный

# Сколько голосов участников нужно набрать любому из трёх вариантов
# 2-го уровня (Не интересно/Отложить в бэклог/Копаем глубже), чтобы
# сигнал перешёл на 2-й уровень. Меняется здесь ИЛИ прямо в админ-панели
# дашборда (админ-панель не трогает этот файл — пишет "живой" оверрайд
# в Firestore, применяется мгновенно у всех, без пересборки).
votes_to_promote: 3

# Визуальные настройки дашборда (src/build_dashboard.py). Светофор
# (зелёный/жёлтый/красный) — фиксированная семантика приоритета и не
# меняется отсюда; accent_color — это цвет вкладок/кнопок/акцентов вокруг
# него.
dashboard:
  title: "Точки роста — Авито.Работа"
  accent_color: "#7C3AED"
  # Ориентир на фирменный фиолетовый Авито — точный HEX не подтверждён
  # официальным брендбуком на момент подготовки, при необходимости
  # замените на точное значение из вашей дизайн-системы.
  github_repo: "tldtv/ai"
  # Для кнопки "Обновить" на дашборде — ведёт на страницу запуска workflow
  # в GitHub Actions. Укажите в формате username/repo (как в адресе вашего
  # репозитория на github.com).
  telegram_bot_username: "AVITO_signals_bot"
  # Имя бота из @BotFather БЕЗ "@" (например "avito_signals_bot") — публичное
  # имя, не секрет (сам токен бота сюда не пишется, он только в GitHub
  # Secrets как TELEGRAM_BOT_TOKEN, см. README). Используется на дашборде
  # только для сборки ссылки вида t.me/<это_имя>?start=<id_подписки> в форме
  # подписки на рассылку. Пока здесь плейсхолдер — кнопка "Открыть бота и
  # нажать Start" не будет работать, пока вы не впишете сюда реальное имя.
  digest_from_email: "Точки роста — Авито.Работа <onboarding@resend.dev>"
  # Отправитель писем еженедельной рассылки (src/send_digest.py). Домен
  # onboarding@resend.dev работает сразу без настройки, но Resend без
  # верификации собственного домена шлёт с него ТОЛЬКО на email, которым
  # вы регистрировались в Resend — остальным подписчикам письма не дойдут,
  # пока вы не подтвердите свой домен в резенде и не поменяете это значение
  # на адрес на нём (например "рассылка@ваш-домен.ру").
  firebase:
    api_key: "AIzaSyA2e9RTnznpcBJ7ofwzYNE9OlNyphWXyvE"
    auth_domain: "avito-signal-agent.firebaseapp.com"
    project_id: "avito-signal-agent"
    storage_bucket: "avito-signal-agent.firebasestorage.app"
    messaging_sender_id: "622646642971"
    app_id: "1:622646642971:web:d2fba93b2c4d3611182bbe"
    # Публичный клиентский конфиг Firebase — ему и положено быть видимым
    # в исходном коде страницы, это не секрет (защита — в Security Rules
    # в консоли Firebase, не в сокрытии этих значений). Без этого блока
    # (или если api_key пустой) дашборд не подключает Firebase вообще —
    # "Не интересно"/правки оценки работают только локально в браузере,
    # а комментарии и админ-панель полностью отключены.

# Веса критериев приоритизации. Меняя веса, вы не трогаете код —
# модель получает актуальный список критериев при каждом запуске.
priority_weights:
  strategic_fit: 1.0        # соответствие одному из трёх рынков
  signal_strength: 1.0      # число независимых источников/повторений
  market_growth: 1.0        # размер и динамика возможности
  asset_fit: 1.0            # fit с активами Авито (трафик, база, данные)
  feasibility: 1.0          # реализуемость MVP
  urgency: 1.0              # окно/конкурентное давление
  regulatory_risk: 1.0      # регуляторный и репутационный риск

# Ограничения процесса — используются только дашбордом/README для
# отображения контекста, на сам сбор сигналов не влияют.
process_constraints:
  max_parallel_discovery: 1
  discovery_timebox_weeks: 4

# Ключевые слова для черновой (эвристической) разметки рынка. ВАЖНО:
# держите здесь и английские, и русские варианты — сопоставление ищет
# точное вхождение подстроки в заголовке/описании статьи "как есть", без
# перевода и без учёта словоформ. Изначально тут были только английские
# слова, из-за чего статьи из русскоязычных источников (vc.ru, Habr,
# CNews — группа "РФ") никогда не проходили require_market_match ниже
# и полностью отсеивались ещё до анализа моделью. Русские ключевые слова
# ниже намеренно даны в виде КОРНЯ слова (например "подработ", а не
# "подработка") — из-за русских падежей ("подработки", "подработкой" и
# т.д.) слово целиком совпадёт со статьёй только в одном падеже, а корень
# — в любом. Финальную гипотезу и рынок уточняет модель на этапе анализа
# — здесь только черновой фильтр, ложные срабатывания не страшны
# (лишний вызов модели), а вот пропуск сигнала — то, чего мы избегаем.
markets:
  Классифайд:
    keywords: [
      "job board", "classifieds", "vacancy marketplace", "listing",
      "джоборд", "классифайд", "объявлен", "вакан", "доска объяв",
    ]
    description: "Классифайд/джоборды — размещение вакансий как объявлений, без транзакционной модели внутри платформы. По воронке ниже (funnel_stages) в первую очередь работает на «Вовлечённость (клики/показы)» и «Работодатели» — платформа зарабатывает на размещении и охвате, а не на самом закрытии позиции."
  Подработка:
    keywords: [
      "gig", "earned wage", "instant pay", "staffing platform", "marketplace", "hourly", "shift", "gig worker",
      "подработ", "гиг-", "самозанят", "почасов", "смен", "занятост",
    ]
    description: "Авито.Подработка — транзакционная платформенная занятость: смены и гиг-задачи, сделка происходит внутри платформы. По воронке ниже — ядро в «Конверсии в наём (отклики → закрытие)», плюс «Соискатели» (пул исполнителей)."
  HR-tech:
    keywords: [
      "recruit", "ats", "screening", "interview", "hiring workflow", "hr tech", "hr-tech", "talent", "ai recruiter",
      "рекрутинг", "рекрутер", "подбор персонала", "найм", "кадров", "скрининг", "резюме", "hr-платформа",
    ]
    description: "HR-tech — продукты HRmost и AIR: инструменты автоматизации найма и рекрутинга для бизнеса. По воронке ниже — прежде всего «Работодатели» (инструменты для их стороны воронки) и «Монетизация (ARPC)» (апсейл существующим работодателям), с косвенным эффектом на «Конверсию в наём»."

# Ключевые метрики воронки Авито.Работы (соискатели/работодатели → показы/
# клики → отклики → закрытые позиции → выручка на клиента), которыми
# компания реально измеряет бизнес. Используется в ДВУХ местах: 1) модель
# в src/analyze_signals.py получает этот список и для каждого сигнала
# выбирает 1-2 наиболее релевантных этапа (поле funnel_stages в backlog.csv)
# — это отдельное измерение от "рынка" (markets выше): рынок — это ЧТО за
# продукт, этап воронки — на КАКОЙ метрике бизнеса он должен сказаться;
# 2) дашборд показывает по этому же списку фильтр "Этап воронки" и метку на
# карточке. Порядок ключей ниже — это и порядок вкладок фильтра на дашборде.
# Смысл каждого этапа: соискатели и работодатели — это два "резервуара"
# воронки (предложение и спрос), между которыми ключевые переходы — показы/
# клики (верхняя часть воронки, вовлечённость) и отклики -> закрытие позиции
# (нижняя часть, собственно наём — самая ценная метрика ликвidности рынка);
# ARPC (average revenue per customer) — монетизация, зависит от того, сколько
# вакансий публикует и закрывает работодатель, то есть является следствием
# остальных этапов, а не отдельным источником сигналов.
funnel_stages:
  "Соискатели":
    description: "Рост числа и качества соискателей на платформе — приток новой аудитории кандидатов, удержание, качество базы резюме."
  "Работодатели":
    description: "Рост числа зарегистрированных работодателей И доля тех, кто реально публикует вакансии (активация, а не просто регистрация)."
  "Вовлечённость (клики/показы)":
    description: "Верхняя часть воронки — показы и клики по вакансиям, видимость и охват платформы среди соискателей."
  "Конверсия в наём (отклики → закрытие)":
    description: "Ядро воронки — доля откликов, доходящих до реального закрытия позиции. Ключевая метрика ликвидности рынка труда внутри платформы."
  "Монетизация (ARPC)":
    description: "Average revenue per customer — выручка на одного работодателя: модели оплаты за размещение/отклик/закрытие, апсейл, доп. услуги."

# Модель для смыслового анализа (src/analyze_signals.py).
llm:
  model: "claude-sonnet-5"
  # ПРОВЕРЬТЕ актуальное имя модели в console.anthropic.com -> Models
  # и поправьте значение здесь, если оно изменилось. На момент подготовки
  # claude-sonnet-5 одновременно новее и дешевле claude-sonnet-4-5 (были
  # раньше здесь) — $2/$10 за млн входных/выходных токенов против $3/$15,
  # то есть при той же нагрузке трафик по этому пункту сам по себе
  # обойдётся примерно на треть дешевле.

# Отсеивать ли статьи, не совпавшие ни с одним ключевым словом рынка
# (см. markets -> keywords выше), ДО обращения к LLM — экономит деньги:
# каждая отправленная в анализ статья — платный вызов Claude API, а общие
# ленты вроде TechCrunch/CNews несут много статей мимо темы. Риск —
# пропустить сигнал, сформулированный необычными словами, мимо списка
# keywords. Поставьте false, если важнее не упустить ничего, чем экономить.
require_market_match: true

# Группы источников — вместо старых числовых tier используются именованные
# группы (описание показывается в подсказке у фильтра "Группа источника").
# Ключи здесь — это ровно то, что указывается в sources -> group ниже.
source_groups:
  "РФ":
    description: "Русскоязычные СМИ и Telegram-каналы про HR-tech, рекрутинг, стартапы и рынок труда в России."
  "Остальной мир":
    description: "Англоязычные международные источники про HR-tech, стартапы, венчур и рынок труда."

# Источники. type: rss — проверенный рабочий RSS (реально протестирован и
