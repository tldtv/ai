name: Backfill Funnel Stages

# Одноразовый (но безопасно перезапускаемый) ручной прогон:
# src/backfill_funnel_stages.py размечает funnel_stages только у тех
# "главных" строк data/backlog.csv, где это поле ещё пустое — то есть у
# сигналов, собранных ДО того, как funnel_stages появился в обычном
# пайплайне (weekly_signal_scan.yml / historical_backfill.yml сами уже
# проставляют его всем новым сигналам). Повторный запуск ничего не стоит,
# если предыдущий уже всё разметил — скрипт пропускает уже заполненные
# строки, поэтому можно смело оставить этот workflow в репозитории и
# запускать снова, если появятся старые неразмеченные строки (например,
# после ручной правки backlog.csv).
#
# concurrency — общая с остальными двумя workflow, которые пишут в тот же
# data/backlog.csv (см. weekly_signal_scan.yml) — чтобы не столкнуться
# коммитами, если что-то запустится одновременно.
concurrency:
  group: signal-pipeline
  cancel-in-progress: false

on:
  workflow_dispatch: {}

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill funnel_stages on existing rows
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python src/backfill_funnel_stages.py

      - name: Build dashboard
        run: python src/build_dashboard.py

      - name: Commit updated backlog and dashboard
        run: |
          git config user.name "avito-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backlog.csv docs/index.html
          git diff --cached --quiet || git commit -m "Разметка funnel_stages на существующих сигналах (backfill) [skip ci]"
          git pull --rebase origin main
          git push
